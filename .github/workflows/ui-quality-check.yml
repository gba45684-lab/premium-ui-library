name: UI quality check starter

on:
  pull_request:
    paths:
      - "**/*.css"
      - "**/*.scss"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.html"
      - "UI_UX_RULES.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Explain project-specific validation
        run: |
          echo "Starter workflow only. Add install, lint, test and build commands after inspecting the app's framework."
          echo "This workflow does not automatically redesign the app."
          echo "Use scoped credentials and pull-request review for any coding-agent automation."
